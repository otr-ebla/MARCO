# Single-robot coverage (see docs/single_robot.md).
#
# One robot, a smaller room (8 m x 6 m, at most four BSP rooms), the same
# local observation as the multi-robot memory actor (pose, velocity, previous
# visited cell, 70-ray lidar, 7x7 directional crop of its own belief map)
# without the communication slots. The global map is never an actor input.
# No recovery fallback: the policy alone drives the robot.
#
# Four policies are compared:
#   Optimal  exact optimal coverage path of the spawn cell (MILP), tracked by a
#            differential-drive controller; full map known in advance
#   IL       DAgger imitation of Optimal           (src.pretrain_bc)
#   RL       MAPPO from scratch                    (src.train_marl)
#   IL+RL    MAPPO from IL, BC term towards Optimal decaying to 0
# All steps: bash scripts/single_robot_experiments.sh --backend cuda
env:
  num_robots: 1
  num_maps: 64
  map_seed: 0
  map_width: 8.0               # metres -> 16 x 12 cells
  map_height: 6.0
  map_depth: 2                 # BSP depth: up to four rooms joined by doorways
  num_humans: 0
  spawn_cells: 8               # fixed start cells per map: the optimal path is planned offline for each
  n_rays: 70
  max_lidar_range: 5.0
  cell_size: 0.5
  wall_cells: 1                # grid-aligned wall bands, at least one occupied cell
  sensing_radius: 5.0
  robot_radius: 0.20
  coverage_overlap: 0.8          # a neighbour cell is covered once the disk enters it by 80% of its radius
  dt: 0.1
  max_steps: 4000              # the optimal expert needs ~2500 steps; margin for learned policies
  v_max: 1.0
  omega_max: 1.0
  terminate_on_collision: false
  obs_mode: memory_comm        # personal lidar-built map; with one robot nothing is merged
  history_cell: previous_visit # past cell only; the actor selects its own next destination
  critic_context: true         # reward/control history is privileged critic input
  fallback_enabled: false      # no recovery fallback
  comm_radius: 0.0
  comm_slots: 0                # no teammates: no communication slots in the observation
  local_coverage_size: 5
  crop_mode: directional       # 7x7: [obstacle, covered, robots] + ring of per-channel means beyond each side
  use_full_memory: true
  observation_stack: 1         # the GRU carries short-term history instead of a frame stack
  critic_stack: 5              # ordered global frames with the robot's visit counts

model:
  hidden_size: 256             # trunk width and GRU state
  lidar_embed: 64
  crop_encoder: cnn
  critic_hidden: 256
  critic_map_embed: 128
  log_std_min: -2.3
  log_std_max: 1.0

train:
  num_envs: 64
  rollout_steps: 128
  total_updates: 2000
  log_interval: 10
  save_interval: 100
  gamma: 0.99
  gae_lambda: 0.95
  lr_actor: 1.0e-4
  lr_critic: 1.0e-3
  lr_decay: true
  clip_eps: 0.2
  entropy_coef: 0.01
  recovery_imitation_coef: 0.0  # no fallback to imitate
  target_kl: 0.02
  max_grad_norm: 10.0
  reward_scale: 1.0            # the simple reward is already O(1) per cell
  huber_delta: 1.0
  n_epochs: 4
  num_minibatches: 8
  normalize_obs: true
  # Behaviour cloning towards the optimal expert during RL, decaying linearly to 0.
  # 0 for pure RL; the IL+RL run sets it with --bc-coef.
  bc_coef: 0.0
  bc_decay_updates: 300

# src.pretrain_bc: DAgger behaviour cloning of the actor, then critic warm-up.
pretrain:
  num_envs: 64
  bc_iterations: 300
  rollout_steps: 128
  beta_decay_iterations: 150
  replay_rollouts: 32
  grad_steps: 48
  minibatch_size: 1024
  lr: 3.0e-4
  decision_weight: 2.0
  decision_threshold: 0.2
  eval_interval: 25
  eval_envs: 16
  critic_warmup_updates: 100
  local_labels: true          # imitate only decisions whose target is inside the actor crop
  rl_init_std: 0.3
  sequence_length: 32
  expert:
    v_cruise: 0.8
    k_omega: 2.0
    heading_power: 3.0
    stop_margin: 0.05
    clearance_ramp: 0.4
    lookahead: 0.3
    yield_radius: 0.9
  # Teacher of IL and of the BC term of IL+RL: the exact optimal coverage path
  # of the spawn cell (src/envs/optimal_expert.py), tracked by the controller above.
  teacher: optimal
  optimal:
    alpha: 1.0                 # J = alpha * moves + beta * revisits
    beta: 1.0
    time_limit: 300            # s per (map, start); TIME_LIMIT keeps the best path and its gap
    workers: 32
    cache_dir: checkpoints/optimal_plans

wandb:
  enabled: true
  project: mrcpp-single
  mode: online

e2e_num_maps: 64
# Simple reward, per robot and step:
#   r = alpha * (new cells covered) - revisit_cost * (re-entries into cells already visited)
#       - tau - wall_kappa * (wall contact) + completion_bonus * (map complete)
e2e_reward:
  reward_mode: simple
  alpha: 1.0                   # per newly covered cell
  revisit_cost: 0.5            # per entry into a cell the robot has already visited (re-coverage)
  tau: 0.01                    # per step: finish sooner
  wall_kappa: 0.1              # per step in contact with a wall
  completion_bonus: 10.0       # once, when every free cell is covered
