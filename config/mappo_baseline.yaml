env:
  num_robots: 3
  # Overridden by e2e_num_maps in training; kept for tools that build a
  # standalone environment from this section.
  num_maps: 1
  map_seed: 0            # deterministic procedural bank; change for held-out maps
  num_humans: 0          # no dynamic obstacles in this baseline
  k_teammates: 0         # how many closest teammates each robot observes
  m_humans: 1            # observation slots for humans (zero-padded when 0 humans)
  n_rays: 70             # lidar rays, one every 10 degrees
  max_lidar_range: 5.0   # metres
  cell_size: 0.5         # metres per grid cell → 24×16 = 384 cells for 12×8 m map
  sensing_radius: 5.0    # radius within which teammates / humans are visible
  robot_radius: 0.20     # metres, used for collision and spawn clearance
  coverage_overlap: 0.3  # a neighbour cell is covered once the disk enters it by 30% of its radius
  dt: 0.1                # physics time step (seconds)
  # Horizon arithmetic: v_max × dt = 0.03 m per step against a 0.5 m cell, so a
  # robot needs ~17 steps to reach a new cell. 384 free cells / 3 robots = 128
  # cells each × 17 ≈ 2130 steps for a *perfect* sweep with zero overlap and no
  # turning; 5000 leaves ~2.3× slack for turns, transit and recovery.
  max_steps: 5000        # steps before truncation
  v_max: 0.3             # max linear velocity (m/s); action[:,0] remapped [-1,1]→[0,v_max]
  omega_max: 1.0         # max angular velocity (rad/s)
  # Soft collisions: an attempted move into a wall, robot or human is rejected,
  # the offender pays kappa, and the episode continues.  Making every contact
  # terminal taught the policy to keep excessive clearance instead of learning
  # how to recover from a close encounter.
  terminate_on_collision: false
  # local coverage patch: gives actors a birds-eye view of nearby coverage without
  # breaking decentralised execution — this is the key driver of efficient coverage
  use_local_coverage_obs: true
  local_coverage_size: 5    # 5×5 = 25 binary cells centred on the robot
  # Wrap the crop in a one-cell ring (→ 7×7): each ring cell averages the
  # robot's own/shared memory over every cell beyond the crop in its direction
  # (strip on the sides, quadrant in the corners), and an extra extent channel
  # says how many cells that covers. Legacy crops also gain a memory known
  # channel. Changes the actor input size: old checkpoints need false.
  crop_summary: true
  # CTDE: every robot's value V_i also reads its own crop and all robots' crops.
  critic_crops: true
  # Actor: one scalar, covered / known free cells in the robot's own memory.
  # Critic: one scalar, true global coverage fraction. Both change the network
  # inputs: checkpoints trained without them need false.
  known_coverage_obs: true
  critic_coverage: true
  # Actor observation. "legacy": velocity + teammates + lidar + coverage patch.
  # "memory_comm": each robot builds its own map from lidar
  # (known / occupied / covered) and ORs it with teammates within comm_radius;
  # obs = pose, velocity, id, (id, dx, dy) per comm slot, lidar, 3×5×5 crop.
  obs_mode: legacy
  sweep_obs: true           # memory_comm: preferred lane dx/dy + next lane cell open
  fallback_enabled: true
  fallback_revisit_threshold: 7  # consecutive covered-cell entries
  fallback_stall_steps: 230      # no discovery (~14 cells of travel at v_max), incl. stopping/spinning
  fallback_linear_accel: 1.0     # m/s², local DWA velocity window
  fallback_angular_accel: 2.0    # rad/s²
  fallback_dwa_steps: 12         # prediction horizon in physics steps
  fallback_dwa_stall_steps: 30   # switch to a velocity sequence after stalled DWA
  fallback_sequence_steps: 64   # command buffer; replenished along the A* route
  fallback_sequence_speed: 0.3  # m/s, <= v_max; each command is guarded by current lidar
  comm_radius: 3.0       # metres; single-hop map exchange per step
  comm_slots: 2          # teammate (id, dx, dy) slots, id 0 = empty
  # reward weights — difference reward: alpha, beta, kappa and psi are charged to
  # the individual robot, the two completion bonuses are the only shared terms
  # Every newly covered cell earns alpha.
  alpha: 10.0
  # Linear growth of the new-cell reward with global coverage:
  # multiplier = 1 + coverage_reward_growth * coverage_ratio.
  # With 2.0, a discovery is worth 1x alpha at 0%, 2x at 50%, 3x near 100%.
  coverage_reward_growth: 2.0
  # At v_max a robot takes about 17 steps to cross one cell (legacy mode only).
  # Four redundant steps cost 2.0, leaving new coverage strongly profitable while
  # making stationary/repetitive behaviour visible to the optimiser.
  beta: 0.5              # distance travelled through already-covered cells
  # Motion quality. Revisit cost is distance-based in the environment, so the
  # same covered path costs the same at any speed. These small control costs
  # discourage full-throttle, oscillatory motion without dominating coverage.
  velocity_cost: 0.05
  angular_cost: 0.01
  action_smoothness_cost: 0.01
  # A blocked move remains undesirable but is cheaper than a newly covered cell,
  # so the policy can approach obstacles and recover instead of freezing early.
  kappa: 50.0             # soft robot-robot collision penalty
  wall_kappa: 30.0        # discourage wall contact without making the policy freeze
  human_kappa: 150.0      # conservative around pedestrians seen by LiDAR
  tau: 0.05              # small universal pressure to finish sooner
  # inter-robot proximity penalty: continuous soft repulsion before hard collision
  # fires when robots are within safe_dist_factor × robot_radius of each other
  psi: 2.0               # proximity penalty weight
  safe_dist_factor: 3.0  # 0.60 m centre distance: 0.20 m clearance at contact
  # room completion bonus: fires once per room when coverage ≥ threshold
  # teaches robots to finish a room before moving to the next one
  room_completion_bonus: 50.0
  room_completion_threshold: 0.85
  # global completion: paid to every robot when the whole reachable free space
  # is covered, which also terminates the episode
  completion_bonus: 200.0

model:
  hidden_size: 128       # actor MLP trunk width
  lidar_embed: 64        # actor 1D-CNN embedding width
  critic_hidden: 256     # centralised critic MLP width
  critic_map_embed: 128  # centralised critic 2D-CNN embedding width

train:
  num_envs: 8            # parallel environment workers (set to your CPU core count)
  rollout_steps: 256     # T — steps per env per update; total = num_envs × T
  total_updates: 2500    # includes ~1000 safety fine-tuning updates with humans
  log_interval: 10       # print every N updates
  save_interval: 100     # save checkpoint every N updates
  gamma: 0.99
  gae_lambda: 0.95
  lr_actor: 3.0e-4
  lr_critic: 1.0e-3
  lr_decay: true         # linear decay to 0 over training
  clip_eps: 0.2
  # Exact tanh-squashed entropy is differentiated under the current policy.
  # Keep this modest during safety fine-tuning so exploration does not dominate
  # avoidance of humans.
  entropy_coef: 0.001
  max_grad_norm: 10.0
  # Reward weights are in task units (a completion bonus is worth 200), which
  # puts undiscounted returns in the hundreds and made the critic loss explode.
  # A single constant factor pulls the critic targets back into roughly
  # [-10, 10] without any running statistic to keep in sync. Logged episode
  # rewards are divided back out, so the CSV stays in environment units.
  reward_scale: 0.05
  # Huber transition point, in scaled-reward units: errors above this contribute
  # a constant gradient instead of a growing one.
  huber_delta: 1.0
  n_epochs: 10           # PPO epochs per update
  num_minibatches: 1     # per epoch, split by environment; raise to fit more envs in GPU memory
  normalize_obs: true    # RunningMeanStd normalisation for stable training

# Weights & Biases dashboards. Every field can be overridden from the command
# line (--wandb / --no-wandb / --wandb-project / --wandb-mode / ...). A failed
# init is never fatal: training falls back to the console and the CSV log.
wandb:
  enabled: true
  project: mrcpp-mappo
  entity:                # null → your default W&B entity
  name:                  # null → W&B generates a run name
  group:                 # null → ungrouped; set to compare seeds of one config
  # "online" needs `wandb login` once. Use "offline" to log to ./wandb and sync
  # later with `wandb sync`, or "disabled" to keep the calls as no-ops.
  mode: online

# Procedural map bank used in training. Each environment samples a map
# independently at reset.
e2e_num_maps: 64

# Reward used by src.train_marl. Layout-agnostic: every
# term uses only the robot's own knowledge (its memory in memory_comm mode).
# Per step at v_max a robot gains 0.06 cells, so reference magnitudes are:
#   discovery      ~ +0.6/step (10 per cell, one cell every ~17 steps)
#   transit        +0.12/step progress, 0 loiter  (driving straight to work)
#   park / spin    -1.0/step loiter              (no discovery, no progress)
#   teammate close -0.2/step at contact, 0 beyond spread_radius
#   teammate in LOS -0.5/step at contact, 0 beyond 5 m, decaying to 10% by step 1500
#   discovery run  +0.5 x run length per new cell (capped at 10), reset on a covered cell
e2e_reward:
  revisit_cost: 1.0          # -c, -2c, -3c per consecutive covered-cell entry
  fallback_cost: 10.0        # once per successful recovery activation
  sweep_straight_bonus: 3.0  # new cell straight ahead in the lane (or reversal after a shift)
  sweep_turn_bonus: 3.0      # lane shift once the cell ahead is a wall or covered
  sweep_break_cost: 5.0      # leaving the lane head while the cell ahead is still open
  reward_mode: progress
  alpha: 10.0
  coverage_reward_growth: 2.0
  axis_alignment_cost: 0.15 # (error / 45 degrees)^2, scaled by actual travel speed; per step, so scaled with v_max
  progress_weight: 2.0       # per cell of geodesic approach to believed-uncovered cells
  loiter_cost: 1.0           # per step, scaled by the missing fraction of full-speed progress
  spread_weight: 0.2         # per step and teammate, linear in (1 - d / spread_radius)
  spread_radius: 2.5         # metres; <= comm_radius so the actor sees who it pays for
  tau: 0.02
  wall_kappa: 2.0
  kappa: 5.0
  human_kappa: 10.0
  # Paid to every robot when the true global coverage reaches 100%. The time
  # bonus is off so completion pays exactly this amount.
  completion_bonus: 100000.0
  completion_time_bonus: 0.0
  # Line-of-sight repulsion: per teammate visible through free space (a wall
  # between the two robots cancels it), max(0, 1 - d / los_spread_radius).
  # Strong at the start to make the team fan out, then decays linearly.
  los_spread_weight: 0.5
  los_spread_radius: 5.0       # = max_lidar_range: the lidar sees who it pays for
  los_spread_decay_steps: 1500
  los_spread_end_fraction: 0.1
  # Incremental run bonus: the k-th consecutive new cell pays
  # discovery_streak_bonus * min(k, cap); entering a covered cell resets k.
  discovery_streak_bonus: 0.5
  discovery_streak_cap: 10
