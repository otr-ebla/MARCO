env:
  num_robots: 3
  # Guided BOSCO uses this single layout. End-to-end modes override it with
  # e2e_num_maps below and bypass the planner entirely.
  num_maps: 1
  map_seed: 0            # deterministic procedural bank; change for held-out maps
  num_humans: 0          # no dynamic obstacles in this baseline
  k_teammates: 0         # how many closest teammates each robot observes
  m_humans: 1            # observation slots for humans (zero-padded when 0 humans)
  n_rays: 70             # lidar rays, one every 10 degrees
  max_lidar_range: 5.0   # metres
  cell_size: 0.5         # metres per grid cell → 24×16 = 384 cells for 12×8 m map
  sensing_radius: 5.0    # radius within which teammates / humans are visible
  robot_radius: 0.20     # metres, used for collision and spawn clearance
  dt: 0.1                # physics time step (seconds)
  # Horizon arithmetic: v_max × dt = 0.1 m per step against a 0.5 m cell, so a
  # robot needs 5 steps to reach a new cell. 302 free cells / 3 robots ≈ 101
  # cells each × 5 = ~505 steps for a *perfect* sweep with zero overlap and no
  # turning. 500 was therefore the exact theoretical minimum, i.e. unreachable
  # in practice; 2000 leaves 4× slack so full coverage is physically possible.
  max_steps: 4000        # steps before truncation
  v_max: 1.0             # max linear velocity (m/s); action[:,0] remapped [-1,1]→[0,v_max]
  omega_max: 1.0         # max angular velocity (rad/s)
  # Soft collisions: an attempted move into a wall, robot or human is rejected,
  # the offender pays kappa, and the episode continues.  Making every contact
  # terminal taught the policy to keep excessive clearance instead of learning
  # how to recover from a close encounter.
  terminate_on_collision: false
  # local coverage patch: gives actors a birds-eye view of nearby coverage without
  # breaking decentralised execution — this is the key driver of efficient coverage
  use_local_coverage_obs: true
  local_coverage_size: 5    # 5×5 = 25 binary cells centred on the robot
  # reward weights — difference reward: alpha, beta, kappa and psi are charged to
  # the individual robot, the two completion bonuses are the only shared terms
  # A discovery in the robot's BOSCO-assigned region earns alpha; discovering
  # a new cell assigned to another robot (or not assigned) earns alpha / 4.
  alpha: 10.0
  # Linear growth of the new-cell reward with global coverage:
  # multiplier = 1 + coverage_reward_growth * coverage_ratio.
  # With 2.0, a discovery is worth 1x alpha at 0%, 2x at 50%, 3x near 100%.
  coverage_reward_growth: 2.0
  # At v_max a robot takes about five steps to cross one cell. Four redundant
  # steps therefore cost 2.0, leaving new coverage strongly profitable while
  # making stationary/repetitive behaviour visible to the optimiser.
  beta: 0.5              # distance travelled through already-covered cells
  # Motion quality. Revisit cost is distance-based in the environment, so the
  # same covered path costs the same at any speed. These small control costs
  # discourage full-throttle, oscillatory motion without dominating coverage.
  velocity_cost: 0.05
  angular_cost: 0.01
  action_smoothness_cost: 0.01
  # A blocked move remains undesirable but is cheaper than a newly covered cell,
  # so the policy can approach obstacles and recover instead of freezing early.
  kappa: 50.0             # soft robot-robot collision penalty
  wall_kappa: 30.0        # discourage wall contact without making the policy freeze
  human_kappa: 150.0      # conservative around pedestrians seen by LiDAR
  tau: 0.05              # small universal pressure to finish sooner
  # inter-robot proximity penalty: continuous soft repulsion before hard collision
  # fires when robots are within safe_dist_factor × robot_radius of each other
  psi: 2.0               # proximity penalty weight
  safe_dist_factor: 3.0  # 0.60 m centre distance: 0.20 m clearance at contact
  # Dense progress towards the current BOSCO waypoint. With a maximum 0.1 m
  # move per step this contributes at most about +0.5 per step.
  bosco_gamma: 10.0
  # Quadratic MARL penalty for straying from the BOSCO waypoint. Distance is
  # measured in cells: cost = weight * (distance / cell_size)^2.
  bosco_distance_penalty: 1.0
  # room completion bonus: fires once per room when coverage ≥ threshold
  # teaches robots to finish a room before moving to the next one
  room_completion_bonus: 50.0
  room_completion_threshold: 0.85
  # global completion: paid to every robot when the whole reachable free space
  # is covered, which also terminates the episode
  completion_bonus: 200.0

model:
  hidden_size: 128       # actor MLP trunk width
  lidar_embed: 64        # actor 1D-CNN embedding width
  critic_hidden: 256     # centralised critic MLP width
  critic_map_embed: 128  # centralised critic 2D-CNN embedding width

train:
  num_envs: 8            # parallel environment workers (set to your CPU core count)
  rollout_steps: 256     # T — steps per env per update; total = num_envs × T
  total_updates: 2500    # includes ~1000 safety fine-tuning updates with humans
  log_interval: 10       # print every N updates
  save_interval: 100     # save checkpoint every N updates
  gamma: 0.99
  gae_lambda: 0.95
  lr_actor: 3.0e-4
  lr_critic: 1.0e-3
  lr_decay: true         # linear decay to 0 over training
  clip_eps: 0.2
  # Exact tanh-squashed entropy is differentiated under the current policy.
  # Keep this modest during safety fine-tuning so exploration does not dominate
  # avoidance of humans.
  entropy_coef: 0.001
  max_grad_norm: 10.0
  # Reward weights are in task units (a completion bonus is worth 200), which
  # puts undiscounted returns in the hundreds and made the critic loss explode.
  # A single constant factor pulls the critic targets back into roughly
  # [-10, 10] without any running statistic to keep in sync. Logged episode
  # rewards are divided back out, so the CSV stays in environment units.
  reward_scale: 0.05
  # Huber transition point, in scaled-reward units: errors above this contribute
  # a constant gradient instead of a growing one.
  huber_delta: 1.0
  n_epochs: 10           # PPO epochs per update
  normalize_obs: true    # RunningMeanStd normalisation for stable training

# Weights & Biases dashboards. Every field can be overridden from the command
# line (--wandb / --no-wandb / --wandb-project / --wandb-mode / ...). A failed
# init is never fatal: training falls back to the console and the CSV log.
wandb:
  enabled: true
  project: mrcpp-mappo
  entity:                # null → your default W&B entity
  name:                  # null → W&B generates a run name
  group:                 # null → ungrouped; set to compare seeds of one config
  # "online" needs `wandb login` once. Use "offline" to log to ./wandb and sync
  # later with `wandb sync`, or "disabled" to keep the calls as no-ops.
  mode: online

# Procedural map bank used by both end-to-end policy modes. Each environment
# samples a map independently at reset; guided BOSCO still uses env.num_maps.
e2e_num_maps: 64

# Applied only by train_bosco end-to-end policy modes.
# beta is charged per covered-cell entry, not per moving timestep.
e2e_reward:
  reward_mode: local_coverage_v1
  alpha: 10.0
  beta: 0.25
  tau: 0.02
  wall_kappa: 2.0
  kappa: 5.0
  human_kappa: 10.0
  completion_bonus: 200.0
  coverage_reward_growth: 2.0
  room_completion_bonus: 0.0
  psi: 0.0
  velocity_cost: 0.0
  angular_cost: 0.0
  action_smoothness_cost: 0.0
